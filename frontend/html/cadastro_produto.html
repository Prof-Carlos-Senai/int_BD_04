    <main>
        <h1>Cadastro do Produto</h1>
        <br>
        <form>
            <label for="nomeProd">Nome do Produto:</label><br>
            <input type="text" id="nomeProd"><br><br>

            <br>
            <button id="btn_cad_produto">Cadastrar</button>
        </form>
        <br>
